name: Actualizar tasas de billeteras

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests

      - name: Correr el script
        run: python actualizar_tasas.py

      - name: Commitear tasas_fci.json si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tasas_fci.json
          git diff --staged --quiet || git commit -m "Actualizar tasas_fci.json ($(date -u +%F))"
          git push
